<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="460" viewBox="0 0 1400 460">
<rect width="1400" height="460" fill="#000000"/>
<text x="64" y="50" fill="#a7a7a7" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="start" letter-spacing="2.1">TRUST MODEL</text>
<text x="64" y="96" fill="#f5f5f5" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" text-anchor="start" letter-spacing="0">Memory is context, not authority</text>
<text x="64" y="128" fill="#c7c7c7" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" text-anchor="start" letter-spacing="0">Engram remembers and explains. It never approves, posts, or files.</text>

<g transform="translate(64 178)">
  <rect width="330" height="188" rx="14" fill="#0d0d0f" stroke="#6b6b6b"/>
  <text x="24" y="34" fill="#a7a7a7" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" text-anchor="start" letter-spacing="1.7">MEMORY</text>
  <text x="24" y="76" fill="#a5b4fc" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start" letter-spacing="0">Guides proposals</text>
  <text x="24" y="112" fill="#c7c7c7" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="500" text-anchor="start" letter-spacing="0">precedent · policy · context</text>
  <text x="24" y="146" fill="#fbbf24" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="start" letter-spacing="0">confidence ≠ evidence</text>
</g>

<g transform="translate(535 178)">
  <rect width="330" height="188" rx="14" fill="#0d0d0f" stroke="#6b6b6b"/>
  <text x="24" y="34" fill="#a7a7a7" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" text-anchor="start" letter-spacing="1.7">EVIDENCE</text>
  <text x="24" y="76" fill="#7dd3fc" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start" letter-spacing="0">Demonstrates</text>
  <text x="24" y="112" fill="#c7c7c7" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="500" text-anchor="start" letter-spacing="0">XML · CDR · PDF · bank</text>
  <text x="24" y="146" fill="#34d399" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="start" letter-spacing="0">content-addressed · WORM</text>
</g>

<g transform="translate(1006 178)">
  <rect width="330" height="188" rx="14" fill="#1f1f1f" stroke="#767676"/>
  <text x="24" y="34" fill="#a7a7a7" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" text-anchor="start" letter-spacing="1.7">AUTHORITY</text>
  <text x="24" y="76" fill="#d4b5fd" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start" letter-spacing="0">Human decision</text>
  <text x="24" y="112" fill="#c7c7c7" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="500" text-anchor="start" letter-spacing="0">approve · reject · return</text>
  <text x="24" y="146" fill="#34d399" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="start" letter-spacing="0">authenticated professional</text>
</g>

<!-- boundaries -->
<path d="M394 272 H535" stroke="#a5b4fc" stroke-width="2"/>
<circle cx="465" cy="272" r="18" fill="#0b0b0b" stroke="#fbbf24" stroke-width="1.5"/>
<text x="465" y="277" fill="#fbbf24" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="middle" letter-spacing="0">≠</text>
<path d="M865 272 H1006" stroke="#7dd3fc" stroke-width="2"/>
<circle cx="936" cy="272" r="18" fill="#0b0b0b" stroke="#d4b5fd" stroke-width="1.5"/>
<text x="936" y="277" fill="#d4b5fd" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="middle" letter-spacing="0">≠</text>

<g transform="translate(64 394)">
  <text x="0" y="0" fill="#fb8585" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" text-anchor="start" letter-spacing="1.0">NO authorize</text>
  <text x="140" y="0" fill="#fb8585" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" text-anchor="start" letter-spacing="1.0">NO approve</text>
  <text x="275" y="0" fill="#fb8585" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" text-anchor="start" letter-spacing="1.0">NO journal posting</text>
  <text x="470" y="0" fill="#fb8585" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" text-anchor="start" letter-spacing="1.0">NO SUNAT filing</text>
  <text x="655" y="0" fill="#a7a7a7" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" text-anchor="start" letter-spacing="0.5">integrity ≠ accounting correctness</text>
</g>
</svg>