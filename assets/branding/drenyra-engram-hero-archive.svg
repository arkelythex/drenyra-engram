<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="460" viewBox="0 0 1400 460">
<defs>
  <filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#100c07" flood-opacity=".14"/></filter>
  <pattern id="grain" width="20" height="20" patternUnits="userSpaceOnUse">
    <circle cx="4" cy="5" r=".45" fill="#17120d" opacity=".02"/><circle cx="15" cy="14" r=".4" fill="#824f16" opacity=".018"/>
  </pattern>
</defs>
<rect width="1400" height="460" fill="#f3eadc"/>
<rect width="1400" height="460" fill="url(#grain)"/>

<text x="70" y="52" fill="#725e4c" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" text-anchor="start" letter-spacing="2.1">ARKELYTHEX / DRENYRA</text>
<text x="70" y="112" fill="#100c07" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="700" text-anchor="start" letter-spacing="0">Drenyra Engram</text>
<text x="70" y="149" fill="#352e22" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="500" text-anchor="start" letter-spacing="0">Institutional accounting memory for AI agents</text>

<g transform="translate(70 202)">
  <line x1="0" y1="0" x2="540" y2="0" stroke="#8a7358" stroke-width="1"/>
  <text x="0" y="40" fill="#824f16" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="start" letter-spacing="0">Memory guides.</text>
  <text x="142" y="40" fill="#0d4a68" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="start" letter-spacing="0">Evidence demonstrates.</text>
  <text x="345" y="40" fill="#315b31" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="start" letter-spacing="0">Humans authorize.</text>
  <text x="0" y="80" fill="#554638" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" text-anchor="start" letter-spacing="0">Context survives sessions, agents, and departures.</text>
</g>

<g transform="translate(70 334)">
  <rect width="540" height="70" rx="10" fill="#fff7ea" stroke="#8a7358" stroke-width="1"/>
  <text x="20" y="26" fill="#554638" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" text-anchor="start" letter-spacing="1.5">SCOPE-FIRST</text>
  <text x="180" y="26" fill="#554638" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" text-anchor="start" letter-spacing="1.5">IMMUTABLE HISTORY</text>
  <text x="390" y="26" fill="#554638" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" text-anchor="start" letter-spacing="1.5">OFFLINE VERIFY</text>
  <circle cx="28" cy="49" r="5" fill="#824f16"/><circle cx="188" cy="49" r="5" fill="#315b31"/><circle cx="398" cy="49" r="5" fill="#0d4a68"/>
  <text x="42" y="54" fill="#17120d" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="500" text-anchor="start" letter-spacing="0">RUC · period</text><text x="202" y="54" fill="#17120d" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="500" text-anchor="start" letter-spacing="0">supersede, never mutate</text><text x="412" y="54" fill="#17120d" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="500" text-anchor="start" letter-spacing="0">Ed25519</text>
</g>

<!-- archive artifact -->
<g transform="translate(865 48)" filter="url(#shadow)">
  <!-- back sheets -->
  <rect x="55" y="20" width="330" height="320" rx="14" fill="#c8ad89" opacity=".75" stroke="#8a7358" transform="rotate(3 220 180)"/>
  <rect x="28" y="10" width="330" height="320" rx="14" fill="#decbb1" stroke="#8a7358" transform="rotate(-2 190 170)"/>
  <!-- front record -->
  <rect x="0" y="0" width="330" height="328" rx="14" fill="#fff7ea" stroke="#66513b" stroke-width="1.3"/>
  <text x="28" y="40" fill="#725e4c" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" text-anchor="start" letter-spacing="1.8">MEMORY / 4011</text>
  <line x1="28" y1="58" x2="302" y2="58" stroke="#8a7358"/>
  <text x="28" y="90" fill="#554638" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" text-anchor="start" letter-spacing="1.2">effectiveAt</text><text x="180" y="90" fill="#100c07" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="start" letter-spacing="0">2026-01-31</text>
  <text x="28" y="122" fill="#554638" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" text-anchor="start" letter-spacing="1.2">recordedAt</text><text x="180" y="122" fill="#100c07" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="start" letter-spacing="0">2026-02-03</text>
  <text x="28" y="154" fill="#554638" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" text-anchor="start" letter-spacing="1.2">confidence</text><text x="180" y="154" fill="#824f16" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="start" letter-spacing="0">0.91</text>
  <text x="28" y="186" fill="#554638" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" text-anchor="start" letter-spacing="1.2">status</text><text x="180" y="186" fill="#315b31" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="start" letter-spacing="0">approved</text>
  <line x1="28" y1="210" x2="302" y2="210" stroke="#8a7358"/>
  <text x="28" y="242" fill="#554638" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" text-anchor="start" letter-spacing="1.2">evidence</text><text x="180" y="242" fill="#0d4a68" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="start" letter-spacing="0">3 objects</text>
  <text x="28" y="270" fill="#554638" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" text-anchor="start" letter-spacing="1.2">rule</text><text x="180" y="270" fill="#57478b" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="start" letter-spacing="0">vigente</text>
  <g transform="translate(270 286)">
    <circle r="24" fill="#e6d7c4" stroke="#315b31" stroke-width="2"/>
    <path d="M-9 0 L-2 7 L12 -10" fill="none" stroke="#315b31" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</g>

<!-- index tab -->
<g transform="translate(1212 92)">
  <rect width="78" height="232" rx="10" fill="#824f16"/>
  <text x="39" y="116" fill="#fff7ea" font-family="Arial" font-size="13" font-weight="700" text-anchor="middle" transform="rotate(90 39 116)" letter-spacing="2">RECONSTRUCTIBLE</text>
</g>
</svg>