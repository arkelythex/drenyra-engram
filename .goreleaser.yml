# Goreleaser configuration — drenyra-engram releases.
#
# Audit-trail surface (open-source product policy, Apache-2.0): every release ships
#   - cross-platform static binaries
#   - SHA-256 checksums (artifact checksum verification)
#   - SPDX SBOM (software bill of materials for supply-chain review)
# SLSA provenance/attestations are NOT shipped: GitHub Attestations requires a
# paid plan for private repos (see RELEASING.md and .github/workflows/release.yml);
# SBOMs + checksums are the current audit evidence.
# See RELEASING.md for the full release process.

version: 2

project_name: drenyra-engram

before:
  hooks:
    - go mod tidy

builds:
  - id: drenyra-engram
    main: ./cmd/drenyra-engram
    binary: drenyra-engram
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"

sboms:
  - id: spdx
    artifacts: binary
    documents:
      - "{{ .Binary }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}.spdx.json"
    cmd: syft
    args:
      - "$artifact"
      - "--output"
      - "spdx-json=$document"

release:
  draft: false
  prerelease: auto
  footer: |
    ---
    Published from the public release workflow. Artifacts verified via
    checksums.txt; SBOMs attached per binary; signed SLSA provenance
    attestations attached per release (see the Actions run) — verify with
    `gh attestation verify <artifact> -R arkelythex/drenyra-engram`.
