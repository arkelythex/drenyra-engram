name: Release

# Automates the Go engine release (RELEASING.md): on every v* tag,
# builds cross-platform static binaries, attaches SPDX SBOMs and SHA-256
# checksums, and generates signed SLSA provenance attestations for every
# artifact via actions/attest (Sigstore). The repository is public
# (Apache-2.0), so GitHub Attestations is available on the free plan.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build & Publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install syft (SBOM generator)
        run: |
          go install github.com/anchore/syft/cmd/syft@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Release
        uses: goreleaser/goreleaser-action@73cd4ffe39ceae11aafd47343ff35e8be087f14c # v7.2.3
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Signed SLSA provenance (actions/attest v4 — the current replacement for
      # attest-build-provenance). subject-checksums binds every artifact listed
      # in checksums.txt (name + SHA-256 digest) into one in-toto attestation
      # signed with a short-lived Sigstore certificate. Verify with:
      #   gh attestation verify <artifact> -R arkelythex/drenyra-engram
      - name: Attest release artifacts (SLSA provenance)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
