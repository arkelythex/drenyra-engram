name: Fuzz CI (bounded)

# Bounded fuzz gate (spec FR-3, AC-2): runs the three frozen fuzz targets via
# `make fuzz-ci` (3 × 30s, never unbounded). Runs on a weekly schedule and on
# manual dispatch only — fuzzing is deliberately NOT part of the push/PR gate
# workflows (go.yml / ci.yml), which stay bounded and unchanged.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz-ci:
    name: Fuzz (3 targets × 30s)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Run bounded fuzz gate
        run: make fuzz-ci
